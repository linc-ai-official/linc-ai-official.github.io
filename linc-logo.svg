<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Linc AI logo">
  <defs>
    <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7dffb2"/>
      <stop offset="1" stop-color="#63e0ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b1020"/>
  <g filter="url(#glow)" fill="none" stroke="url(#lg)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- the flowing swoosh (your drawing!) -->
    <path d="M 60 205
             C 78 150, 150 128, 190 182
             C 262 250, 322 300, 250 360
             C 208 392, 182 350, 220 327
             C 298 288, 362 244, 448 178"/>
  </g>
</svg>
